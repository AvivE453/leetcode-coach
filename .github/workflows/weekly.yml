name: Weekly coach report
# (Trivial touch to force GitHub's initial workflow-sync scan - the first
# push from `gh repo create --push` can race with it on a brand-new repo.)

on:
  schedule:
    - cron: "0 4 * * 0"  # Sundays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Lean install: the planner reads tags and the DB, and embeddings are
      # already stored, so torch never needs to reach CI.
      - name: Install dependencies
        run: uv sync

      - name: Generate the weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run coach weekly

      # Only reports/ is committed. data/coach.db also changes (coach weekly
      # records a weekly_runs row), but it is a binary SQLite file that Aviv
      # writes to daily from his laptop - letting CI commit it too would produce
      # merge conflicts git cannot resolve. Single writer for the database.
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new report content to commit."
          else
            # %G-%V (ISO 8601 week + its own year) matches week_key()'s
            # isocalendar()-based filename. %Y-%W is a different, non-ISO
            # week number and can disagree with the file it's describing.
            git commit -m "Weekly report $(date -u +%G-%V)"
            git push
          fi
