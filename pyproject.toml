[project]
name = "leetcode-coach"
version = "0.1.0"
description = "Personal LeetCode coach: pattern-based solution retrieval, spaced repetition, and a weekly planning agent"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "httpx[http2]>=0.27",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[project.scripts]
coach = "coach.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff.lint]
ignore = [
    "B008",   # typer's API is built on function-call argument defaults
    "DTZ011", # local dates are the right semantics for a personal local tool
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coach"]
