[project]
name = "leetcode-coach"
version = "0.1.0"
description = "Personal LeetCode coach: pattern-based solution retrieval, spaced repetition, and per-pattern mastery tracking"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "httpx[http2]>=0.27",
    "anthropic>=1.0",
    "pydantic>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
coach = "coach.cli:app"
coach-web = "coach.web.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.9.0",
    "ruff>=0.6",
]

[tool.ruff.lint]
ignore = [
    "B008",   # typer's API is built on function-call argument defaults
    "DTZ011", # local dates are the right semantics for a personal local tool
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coach"]
