<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leetcode-coach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232563eb'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2360a5fa'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="brand">
      <h1>leetcode-coach</h1>
      <span class="sub">practice, tracked by pattern</span>
    </div>
    <nav class="pills" aria-label="Sections">
      <a href="/" aria-current="page">Home</a>
      <a href="/solutions">Problems Solved</a>
      <a href="/plan">Daily Plan</a>
      <a href="/weekly">Weekly Review</a>
    </nav>
  </header>

  <main>
    <h2 class="sr-only">Progress</h2>

    <div class="hero tone-hotpink">
      <div>
        <p class="label">Problems solved</p>
        <p class="big" id="hero-solved">–</p>
        <p class="note" id="hero-note">Loading your numbers…</p>
        <p class="hero-diff" id="hero-diff"></p>
      </div>
      <a class="btn" href="/log">I solved a question</a>
    </div>

    <div class="grid" id="stat-cards"></div>

    <section aria-labelledby="patterns-heading">
      <div class="card tone-teal">
        <h2 class="k section-title" id="patterns-heading">Patterns you have practiced</h2>
        <div id="pattern-table"></div>
      </div>
    </section>
  </main>
</div>

<script src="/static/dom.js"></script>
<script src="/static/home.js"></script>
</body>
</html>
