<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log a solve · leetcode-coach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232563eb'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2360a5fa'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="brand">
      <h1>leetcode-coach</h1>
      <span class="sub">log what you just solved</span>
    </div>
    <nav class="pills" aria-label="Sections">
      <a href="/">Home</a>
      <a href="/solutions">Problems Solved</a>
      <a href="/plan">Daily Plan</a>
      <a href="/weekly">Weekly Review</a>
    </nav>
  </header>

  <main>
    <form class="card form-card tone-blue" id="log-form" aria-labelledby="log-heading" novalidate>
      <h2 class="k section-title" id="log-heading">Log a solve</h2>
      <p class="hint">Stores the attempt and your code, tags the pattern, and reschedules the review.</p>

      <div class="field">
        <label for="number">LeetCode problem number</label>
        <input type="text" id="number" name="number" required autocomplete="off"
               inputmode="numeric" aria-describedby="form-error">
      </div>

      <fieldset>
        <legend class="fieldset-label">How did it go?</legend>
        <div class="radios">
          <label><input type="radio" name="outcome" value="clean" checked> Clean</label>
          <label><input type="radio" name="outcome" value="struggled"> Struggled</label>
          <label><input type="radio" name="outcome" value="hints"> Needed hints</label>
          <label><input type="radio" name="outcome" value="failed"> Failed</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="minutes">Minutes spent (optional)</label>
        <input type="text" id="minutes" name="minutes" autocomplete="off"
               inputmode="numeric" aria-describedby="form-error">
      </div>

      <div class="field">
        <label for="note">Note (optional)</label>
        <input type="text" id="note" name="note" autocomplete="off">
      </div>

      <div class="field">
        <label for="code">Your solution</label>
        <textarea id="code" name="code" required spellcheck="false"
                  aria-describedby="code-help form-error"
                  placeholder="class Solution:&#10;    def twoSum(self, nums, target):&#10;        ..."></textarea>
        <p class="hint" id="code-help">Pasted exactly as you wrote it — the tagger reads the approach as written.</p>
      </div>

      <button class="btn" type="submit" id="submit">Log this solve</button>
      <p class="error" id="form-error" role="alert" hidden></p>
    </form>

    <div class="card result tone-orange" id="log-result" hidden aria-live="polite"></div>
  </main>
</div>

<script src="/static/dom.js"></script>
<script src="/static/log.js"></script>
</body>
</html>
