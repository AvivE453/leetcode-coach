<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Review · leetcode-coach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232563eb'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2360a5fa'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="brand">
      <h1>leetcode-coach</h1>
      <span class="sub">this week, as it stands</span>
    </div>
    <nav class="pills" aria-label="Sections">
      <a href="/">Home</a>
      <a href="/solutions">Problems Solved</a>
      <a href="/plan">Daily Plan</a>
      <a href="/weekly" aria-current="page">Weekly Review</a>
    </nav>
  </header>

  <main>
    <div class="grid" id="counts" style="margin-top:0"></div>

    <section class="card tone-hotpink" aria-labelledby="week-heading">
      <h2 class="k section-title" id="week-heading">All solutions from last seven days</h2>
      <p class="hint" id="week-meta"></p>
      <div id="week-table">
        <p class="loading">Loading this week…</p>
      </div>
    </section>

    <section class="card tone-teal" aria-labelledby="week-patterns-heading">
      <h2 class="k section-title" id="week-patterns-heading">Patterns you used this week</h2>
      <p class="hint" id="patterns-hint">Mastery is all-time, so a week of practice moves it rather than defining it.</p>
      <div id="patterns-table"></div>
    </section>

    <section>
      <div class="topics" id="verdicts"></div>
    </section>
  </main>
</div>

<script src="/static/dom.js"></script>
<script src="/static/weekly.js"></script>
</body>
</html>
